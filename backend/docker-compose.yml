# Полный набор сервисов для локальной разработки и production-подобной среды
# ===========================================================================
version: "3.9"

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  DATABASE_URL: postgres://aibot:aibot@postgres:5432/aibot
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: django-db
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  DJANGO_ALLOWED_HOSTS: "*"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: aibot
      POSTGRES_DB: aibot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    command:
      [
        "gunicorn", "config.wsgi:application",
        "--bind", "0.0.0.0:8000",
        "--workers", "4", "--threads", "2",
        "--access-logfile", "-",
      ]

  daphne:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]

  celery-worker:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    volumes:
      - ./:/app
      - media_data:/app/media
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "default,telegram,ai"]

  celery-beat:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

  celery-flower:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    depends_on:
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    ports:
      - "5555:5555"
    command: ["celery", "-A", "config", "flower", "--port=5555"]

  telegram-bot:
    build:
      context: ..
      dockerfile: backend/docker/django/Dockerfile
    restart: always
    depends_on:
      - backend
      - redis
    environment:
      <<: *django-env
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["python", "manage.py", "run_polling"]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - backend
      - daphne
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
